name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Advisor pipeline tests (offline, no API keys)
        working-directory: IAAS
        run: pytest -q
      - name: Plan-checker eval tests
        run: pytest -q evals

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IAAS/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: IAAS/client/package-lock.json
      - run: npm ci
      - run: CI=true npx react-scripts test --watchAll=false
      - run: npx react-scripts build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-academic-advisor-api .
